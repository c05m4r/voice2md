[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/transcriber",
    "crates/cli",
    "crates/telegram-bot",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
notify = "8"
dashmap = "6"
teloxide = { version = "0.13", default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }
futures-util = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
